<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-labelledby="t d"><title id="t">Aditya Srivastava</title><desc id="d">A stack of five translucent planes labelled Product, Agents, Models, Systems and Silicon, with a point of light travelling down through them.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif}.pulse{opacity:0;animation:drop 6s linear infinite}@keyframes drop{0%{transform:translateY(0);opacity:0}6%{opacity:1}70%{transform:translateY(250px);opacity:1}78%,100%{transform:translateY(250px);opacity:0}}.glow{opacity:0;animation:lit 6s ease-out infinite}@keyframes lit{0%{opacity:0}5%{opacity:1}24%,100%{opacity:0}}@media (prefers-reduced-motion:reduce){.pulse,.glow{animation:none}}</style><defs><radialGradient id="halo" cx=".73" cy=".5" r=".5"><stop offset="0" stop-color="#3FD6C8" stop-opacity=".16"/><stop offset="1" stop-color="#3FD6C8" stop-opacity="0"/></radialGradient><filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.5"/></filter><linearGradient id="p4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB36B" stop-opacity=".26"/><stop offset="1" stop-color="#FFB36B" stop-opacity=".05"/></linearGradient><linearGradient id="p3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7FB8FF" stop-opacity=".26"/><stop offset="1" stop-color="#7FB8FF" stop-opacity=".05"/></linearGradient><linearGradient id="p2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B49CFF" stop-opacity=".26"/><stop offset="1" stop-color="#B49CFF" stop-opacity=".05"/></linearGradient><linearGradient id="p1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3FD6C8" stop-opacity=".26"/><stop offset="1" stop-color="#3FD6C8" stop-opacity=".05"/></linearGradient><linearGradient id="p0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8FAB" stop-opacity=".26"/><stop offset="1" stop-color="#FF8FAB" stop-opacity=".05"/></linearGradient></defs><rect width="900" height="380" rx="24" fill="#0A1A21"/><rect width="900" height="380" rx="24" fill="url(#halo)"/><rect x=".5" y=".5" width="899" height="379" rx="23.5" fill="none" stroke="#E9F1F2" stroke-opacity=".1"/><text class="serif" x="44" y="164" font-size="62" font-weight="500" fill="#E9F1F2" letter-spacing="-.5">Aditya</text><text class="serif" x="44" y="230" font-size="62" font-weight="500" fill="#E9F1F2" letter-spacing="-.5">Srivastava</text><text x="44" y="278" font-size="18" fill="#E9F1F2" fill-opacity=".92">I design systems that cross silicon, models,</text><text x="44" y="304" font-size="18" fill="#E9F1F2" fill-opacity=".92">agents and product, and keep them running.</text><polygon points="660,240 790,300 660,360 530,300" fill="url(#p4)" stroke="#FFB36B" stroke-width="1.4" stroke-opacity=".9" stroke-linejoin="round"/><line x1="692.5" y1="255.0" x2="562.5" y2="315.0" stroke="#FFB36B" stroke-opacity="0.18" stroke-width="0.75"/><line x1="627.5" y1="255.0" x2="757.5" y2="315.0" stroke="#FFB36B" stroke-opacity="0.18" stroke-width="0.75"/><line x1="725.0" y1="270.0" x2="595.0" y2="330.0" stroke="#FFB36B" stroke-opacity="0.18" stroke-width="0.75"/><line x1="595.0" y1="270.0" x2="725.0" y2="330.0" stroke="#FFB36B" stroke-opacity="0.18" stroke-width="0.75"/><line x1="757.5" y1="285.0" x2="627.5" y2="345.0" stroke="#FFB36B" stroke-opacity="0.18" stroke-width="0.75"/><line x1="562.5" y1="285.0" x2="692.5" y2="345.0" stroke="#FFB36B" stroke-opacity="0.18" stroke-width="0.75"/><polygon class="glow" style="animation-delay:3.9s" points="660,240 790,300 660,360 530,300" fill="none" stroke="#FFB36B" stroke-width="3" stroke-linejoin="round" filter="url(#blur)"/><line x1="796.0" y1="300.0" x2="820.0" y2="300.0" stroke="#FFB36B" stroke-opacity="0.6" stroke-width="1"/><text x="828" y="305" font-size="15" font-weight="600" fill="#FFB36B"