<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="t d"><title id="t">Five domains, one system</title><desc id="d">Five planets orbit a core labelled stack, drawn from the author's GitHub profile. Edge and systems is on the inner ring, then JavaScript, ML and Full stack, with Cloud architecture on the outermost ring.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif}.ping{transform-box:fill-box;transform-origin:center;animation:pg 3.2s ease-out infinite}@keyframes pg{0%{transform:scale(1);opacity:.45}100%{transform:scale(1.55);opacity:0}}.mn{animation:moon 3s linear infinite}@keyframes moon{to{transform:rotate(360deg)}}.st{opacity:.4;animation:tw 3s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.12}50%{opacity:.7}}.o0{transform:rotate(200deg);animation:s0 20s linear infinite}@keyframes s0{from{transform:rotate(200deg)}to{transform:rotate(560deg)}}.o1{transform:rotate(20deg);animation:s1 28s linear infinite}@keyframes s1{from{transform:rotate(20deg)}to{transform:rotate(-340deg)}}.o2{transform:rotate(300deg);animation:s2 38s linear infinite}@keyframes s2{from{transform:rotate(300deg)}to{transform:rotate(660deg)}}.o3{transform:rotate(110deg);animation:s3 50s linear infinite}@keyframes s3{from{transform:rotate(110deg)}to{transform:rotate(-250deg)}}.o4{transform:rotate(250deg);animation:s4 64s linear infinite}@keyframes s4{from{transform:rotate(250deg)}to{transform:rotate(610deg)}}@media (prefers-reduced-motion:reduce){.ping,.mn,.st,.o0,.o1,.o2,.o3,.o4{animation:none}}</style><defs><radialGradient id="core"><stop offset="0" stop-color="#0C2430" stop-opacity=".16"/><stop offset="1" stop-color="#0C2430" stop-opacity=".03"/></radialGradient><filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter></defs><rect width="900" height="400" rx="24" fill="#F3F7F7"/><rect x=".5" y=".5" width="899" height="399" rx="23.5" fill="none" stroke="#0C2430" stroke-opacity=".1"/><circle class="st" cx="384" cy="69" r="1.2" fill="#0C2430" style="animation-delay:-2.0s"/><circle class="st" cx="289" cy="213" r="1.2" fill="#0C2430" style="animation-delay:-1.1s"/><circle class="st" cx="284" cy="203" r="1.2" fill="#0C2430" style="animation-delay:-0.1s"/><circle class="st" cx="425" cy="38" r="1.2" fill="#0C2430" style="animation-delay:-0.3s"/><circle class="st" cx="422" cy="323" r="1.2" fill="#0C2430" style="animation-delay:-0.4s"/><circle class="st" cx="346" cy="248" r="1.2" fill="#0C2430" style="animation-delay:-2.8s"/><circle class="st" cx="629" cy="30" r="1.2" fill="#0C2430" style="animation-delay:-2.6s"/><circle class="st" cx="371" cy="66" r="1.2" fill="#0C2430" style="animation-delay:-0.4s"/><circle class="st" cx="378" cy="319" r="1.2" fill="#0C2430" style="animation-delay:-0.5s"/><circle class="st" cx="481" cy="252" r="1.2" fill="#0C2430" style="animation-delay:-1.1s"/><circle class="st" cx="468" cy="36" r="1.2" fill="#0C2430" style="animation-delay:-0.2s"/><circle class="st" cx="339" cy="268" r="1.2" fill="#0C2430" style="animation-delay:-1.3s"/><circle class="st" cx="380" cy="232" r="1.2" fill="#0C2430" style="animation-delay:-1.4s"/><circle class="st" cx="375" cy="311" r="1.2" fill="#0C2430" style="animation-delay:-2.1s"/><circle class="st" cx="354" cy="228" r="1.2" fill="#0C2430" style="animation-delay:-1.6s"/><circle class="st" cx="591" cy="286" r="1.2" fill="#0C2430" style="animation-delay:-0.9s"/><circle class="st" cx="631" cy="56" r="1.2" fill="#0C2430" style="animation-delay:-1.3s"/><g transform="translate(450 200)"><circle class="ping" r="44" fill="none" stroke="#0C2430" stroke-opacity=".5"/><circle r="44" fill="url(#core)" stroke="#0C2430" stroke-opacity=".22"/><text class="serif" y="5" text-anchor="middle" font-size="14" font-style="italic" fill="#0C2430">stack</text><circle r="66" fill="none" stroke="#0C2430" stroke-opacity=".14" stroke-dasharray="2 6"/><g class="o0"><g transform="translate(66 0)"><circle r="11" fill="#B8610A" fill-opacity=".35" filter="url(#blur)"/><circle r="6.5" fill="#B8610A"/><g class="mn" style="animation-duration:2.20s"><circle cx="13" r="2.2" fill="#0C2430" fill-opacity=".8"/></g></g></g><circle r="92" fill="none" stroke="#0C2430" stroke-opacity=".14" stroke-dasharray="2 6"/><g class="o1"><g transform="translate(92 0)"><circle r="11" fill="#2563C9" fill-opacity=".35" filter="url(#blur)"/><circle r="6.5" fill="#2563C9"/><g class="mn" style="animation-duration:2.65s"><circle cx="13" r="2.2" fill="#0C2430" fill-opacity=".8"/></g></g></g><circle r="118" fill="none" stroke="#0C2430" stroke-opacity=".14" stroke-dasharray="2 6"/><g class="o2"><g transform="translate(118 0)"><circle r="11" fill="#6A4CE0" fill-opacity=".35" filter="url(#blur)"/><circle r="6.5" fill="#6A4CE0"/><g class="mn" style="animation-duration:3.10s"><circle cx="13" r="2.2" fill="#0C2430" fill-opacity=".8"/></g></g></g><circle r="144" fill="none" stroke="#0C2430" stroke-opacity=".14" stroke-dasharray="2 6"/><g class="o3"><g transform="translate(144 0)"><circle r="11" fill="#0A8F85" fill-opacity=".35" filter="url(#blur)"/><circle r="6.5" fill="#0A8F85"/><g class="mn" style="animation-duration:3.55s"><circle cx="13" r="2.2" fill="#0C2430" fill-opacity=".8"/></g></g></g><circle r="170" fill="none" stroke="#0C2430" stroke-opacity=".14" stroke-dasharray="2 6"/><g class="o4"><g transform="translate(170 0)"><circle r="11" fill="#D63A6A" fill-opacity=".35" filter="url(#blur)"/><circle r="6.5" fill="#D63A6A"/><g class="mn" style="animation-duration:4.00s"><circle cx="13" r="2.2" fill="#0C2430" fill-opacity=".8"/></g></g></g></g><text class="serif" x="44" y="172" font-size="30" fill="#0C2430">One system,</text><text class="serif" x="44" y="208" font-size="30" fill="#0C2430">five domains.</text><text x="44" y="240" font-size="12" fill="#52707A">Inner rings are what I</text><text x="44" y="258" font-size="12" fill="#52707A">build on.</text><text x="44" y="282" font-size="12" fill="#52707A">Outer rings are what</text><text x="44" y="300" font-size="12" fill="#52707A">I ship on.</text><circle cx="668" cy="120" r="5" fill="#D63A6A"/><text x="684" y="124" font-size="14" font-weight="600" fill="#D63A6A">Cloud architecture</text><text x="684" y="140" font-size="11" fill="#52707A">Workers, Firebase, OCI, Docker</text><circle cx="668" cy="160" r="5" fill="#0A8F85"/><text x="684" y="164" font-size="14" font-weight="600" fill="#0A8F85">Full stack</text><text x="684" y="180" font-size="11" fill="#52707A">TypeScript, React, Next.js, Node</text><circle cx="668" cy="200" r="5" fill="#6A4CE0"/><text x="684" y="204" font-size="14" font-weight="600" fill="#6A4CE0">ML</text><text x="684" y="220" font-size="11" fill="#52707A">Python, PyTorch, QLoRA</text><circle cx="668" cy="240" r="5" fill="#2563C9"/><text x="684" y="244" font-size="14" font-weight="600" fill="#2563C9">JavaScript</text><text x="684" y="260" font-size="11" fill="#52707A">Node, Workers, vanilla JS</text><circle cx="668" cy="280" r="5" fill="#B8610A"/><text x="684" y="284" font-size="14" font-weight="600" fill="#B8610A">Edge &amp; systems</text><text x="684" y="300" font-size="11" fill="#52707A">Jetson, CUDA, Linux, Rust</text></svg>